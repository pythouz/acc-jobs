name: Job Scraper

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours (edit to '0 * * * *' for hourly)
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

permissions:
  contents: write            # needed to commit seen_jobs.json back to the repo

concurrency:
  group: job-scraper
  cancel-in-progress: false  # never cancel a run mid-way through a commit/push

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scraper.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen_jobs.json [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
